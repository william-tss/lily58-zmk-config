# Nome Bluetooth della tastiera
CONFIG_ZMK_KEYBOARD_NAME="Lily58"

# Massima potenza Bluetooth (+8dBm) per evitare disconnessioni tra le due metà e verso il Mac
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Miglioramenti stabilità connessione Bluetooth
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Risparmio energetico (Deep Sleep dopo 15 minuti di inattività)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
